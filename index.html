<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration | Client-Side Validation</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page">
    <div class="form-card">
      <h1>Student Registration</h1>
      <p class="subtitle">Fields marked <span class="req">*</span> are mandatory</p>

      <form id="registerForm" novalidate>
        <div class="row">
          <div class="field">
            <label for="fullName">Full Name <span class="req">*</span></label>
            <input type="text" id="fullName" name="fullName" placeholder="e.g. Nakul T">
            <small class="error" id="fullNameError"></small>
          </div>
          <div class="field">
            <label for="dob">Date of Birth <span class="req">*</span></label>
            <input type="date" id="dob" name="dob">
            <small class="error" id="dobError"></small>
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label for="email">Email ID <span class="req">*</span></label>
            <input type="email" id="email" name="email" placeholder="name@example.com">
            <small class="error" id="emailError"></small>
          </div>
          <div class="field">
            <label for="phone">Phone Number <span class="req">*</span></label>
            <input type="tel" id="phone" name="phone" placeholder="10-digit mobile number" maxlength="10">
            <small class="error" id="phoneError"></small>
          </div>
        </div>

        <div class="field">
          <label>Gender <span class="req">*</span></label>
          <div class="radio-group">
            <label><input type="radio" name="gender" value="Male"> Male</label>
            <label><input type="radio" name="gender" value="Female"> Female</label>
            <label><input type="radio" name="gender" value="Other"> Other</label>
          </div>
          <small class="error" id="genderError"></small>
        </div>

        <div class="field">
          <label for="address">Address <span class="req">*</span></label>
          <textarea id="address" name="address" rows="2" placeholder="Door no, street, area"></textarea>
          <small class="error" id="addressError"></small>
        </div>

        <div class="row">
          <div class="field">
            <label for="city">City <span class="req">*</span></label>
            <input type="text" id="city" name="city" placeholder="e.g. Coimbatore">
            <small class="error" id="cityError"></small>
          </div>
          <div class="field">
            <label for="pincode">PIN Code <span class="req">*</span></label>
            <input type="text" id="pincode" name="pincode" placeholder="6-digit PIN" maxlength="6">
            <small class="error" id="pincodeError"></small>
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label for="password">Password <span class="req">*</span></label>
            <input type="password" id="password" name="password" placeholder="Min 8 chars, A-z, 0-9, symbol">
            <small class="error" id="passwordError"></small>
          </div>
          <div class="field">
            <label for="confirmPassword">Confirm Password <span class="req">*</span></label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password">
            <small class="error" id="confirmPasswordError"></small>
          </div>
        </div>

        <div class="field checkbox">
          <label><input type="checkbox" id="terms"> I agree to the terms and conditions <span class="req">*</span></label>
          <small class="error" id="termsError"></small>
        </div>

        <div class="actions">
          <button type="reset" class="btn btn-light">Reset</button>
          <button type="submit" class="btn btn-primary">Register</button>
        </div>
      </form>

      <div id="successBox" class="success hidden"></div>
    </div>
  </div>

  <script src="js/validation.js"></script>
</body>
</html>
